name: Snapshot live site

# Downloads every file of the live site into the "live-snapshot" branch,
# so it can be compared with the copy on main. Never touches GoDaddy.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the live site
        run: |
          python3 - <<'PY'
          import os, sys, urllib.request, urllib.parse
          sys.path.insert(0, "monitor")
          import check_site as c
          site = c.RULES["site"].rstrip("/")
          for path in sorted(c.site_files()):
              url = site + (path[:-len("index.html")] if path.endswith("/index.html") else urllib.parse.quote(path))
              out = "/tmp/live" + path
              os.makedirs(os.path.dirname(out), exist_ok=True)
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": c.UA})
                  open(out, "wb").write(urllib.request.urlopen(req, timeout=60).read())
                  print("ok  ", path)
              except Exception as e:
                  print("MISS", path, e)
          PY
      - name: Save it to the live-snapshot branch
        run: |
          git config user.name "site-monitor"
          git config user.email "site-monitor@users.noreply.github.com"
          git checkout --orphan live-snapshot
          git rm -rfq .
          cp -r /tmp/live/. .
          git add -A
          git commit -qm "Live site snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin live-snapshot
