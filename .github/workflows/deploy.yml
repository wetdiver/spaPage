name: Deploy to GoDaddy

# Uploads the website to GoDaddy whenever site files change on GitHub.
# Only changed files are sent. Monitor code and this folder are never uploaded.
on:
  push:
    branches: [main]
    paths-ignore:
      - "monitor/**"
      - ".github/**"
      - "README.md"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Upload changed files over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            monitor/**
            README.md
            .gitignore
