name: Deploy to GoDaddy

# Uploads the website to GoDaddy whenever site files change on GitHub.
# Only changed files are sent. Monitor code and this folder are never uploaded.
on:
  push:
    branches: [main]
    paths-ignore:
      - "monitor/**"
      - ".github/**"
      - "README.md"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Upload changed files over FTP
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # GoDaddy's hosting server for this site (its secure-FTP certificate is issued to this name,
          # not to sxm-massage-onsite.com). If GoDaddy ever moves the hosting, update it here.
          server: p3plzcpnl506973.prod.phx3.secureserver.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            monitor/**
            README.md
            .gitignore

      - name: Wait a moment if GoDaddy timed out
        if: steps.ftp1.outcome == 'failure'
        run: sleep 45

      - name: Retry the upload once
        if: steps.ftp1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # GoDaddy's hosting server for this site (its secure-FTP certificate is issued to this name,
          # not to sxm-massage-onsite.com). If GoDaddy ever moves the hosting, update it here.
          server: p3plzcpnl506973.prod.phx3.secureserver.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            monitor/**
            README.md
            .gitignore

      - name: Tell Bing and other IndexNow search engines what changed
        if: success()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          urls = re.findall(r"<loc>(https://sxm-massage-onsite\.com/[^<]*/?)</loc>", open("sitemap.xml").read())
          urls = [u for u in urls if not u.endswith((".webp", ".jpg", ".png"))]
          body = json.dumps({"host": "sxm-massage-onsite.com", "key": "dff120c7c75945a6bcfbadebc0888014",
                             "keyLocation": "https://sxm-massage-onsite.com/dff120c7c75945a6bcfbadebc0888014.txt",
                             "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r: print("IndexNow:", r.status, "for", len(urls), "pages")
          except Exception as e: print("IndexNow not accepted this time:", e)
          PY
